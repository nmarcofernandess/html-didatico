<!-- Documento em branco. Escreva com componentes (referência: componentes.md; vitrine: pecas.html).
     Para uma forma pronta, prefira montar.mjs --novo <cartao|explicacao|passo-a-passo|aula|decidir|prova|montagem|maquete>. -->
<d-doc>

  <d-cover kind="{{forma}}" subject="{{produto · assunto}}" date="{{dd/mm/aaaa}}" sub="{{o caso em uma linha, com os números}}" lead="{{o que o leitor consegue fazer no fim}}">{{título}}</d-cover>

  <d-origin where="{{onde estamos: o sistema, a frente e o estado, com a data}}" q="{{a pergunta real em jogo, com o caso}}" ask="{{o que se pede de quem lê}}">
    <li term="{{termo interno}}">{{o que ele é, numa frase}}</li>
  </d-origin>

  <main>
    <d-part title="{{a pergunta do leitor}}">
      <p>{{a resposta em uma ou duas frases, com o dado do caso}}</p>
      <w-fig cap="{{a conclusão que a figura mostra, com o dado do caso}}">
        <w-win title="{{nome da tela}}">
          <w-field label="{{rótulo}}" value="{{valor}}" mark></w-field>
          <w-text lines="2"></w-text>
        </w-win>
      </w-fig>
    </d-part>
  </main>

  <d-foot left="{{produto · assunto}}" right="{{documento · dd/mm/aaaa}}"></d-foot>

</d-doc>
