  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

ex-direction: column; gap: 16px; }\n.df-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }\n.df-col { display: flex; flex-direction: column; gap: 12px; }\n.df-grow { flex: 1 1 auto; min-width: 0; }\n.df-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }\n\n/* typeScale: as classes .ts-* vêm de tokens.css (type.groups). Aqui só o eyebrow, que precisa de transform/cor. */\n.ts-eyebrow { font-size: 12px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--default-500); }\n.fg { color: var(--foreground); }\n.fg-700 { color: var(--default-700); }\n.fg-600 { color: var(--default-600); }\n.fg-500 { color: var(--default-500); }\n.fg-400 { color: var(--default-400); }\n.fg-primary { color: var(--primary); }\n.fg-accent { color: var(--primary-700); }\n.fg-danger { color: var(--danger); }\n.fg-warning { color: var(--warning-700); }\n.fg-success { color: var(--success); }\n.mono { font-family: var(--font-mono); }\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* Ícone Iconify lucide (stroke 2, 24 viewBox), tamanho em 1em por padrão */\n.df-icon { display: inline-block; flex-shrink: 0; vertical-align: middle; }\n\n/* Divider HeroUI */\n.df-divider { border: 0; height: 1px; background: var(--divider); width: 100%; margin: 0; flex-shrink: 0; }\n.df-divider-v { width: 1px; align-self: stretch; background: var(--divider); flex-shrink: 0; }\n\n/* Button — HeroUI v2 (size × variant × color) */\n.df-btn { font: inherit; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; border: 0; cursor: pointer; user-select: none; overflow: hidden; outline: none; transition: opacity .15s, background-color .15s, transform .1s; text-decoration: none; flex-shrink: 0; }\n.df-btn:active { transform: scale(.97); }\n.df-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n.df-btn[disabled], .df-btn.is-disabled { opacity: .5; cursor: default; pointer-events: none; }\n.df-btn-sm { height: 32px; min-width: 64px; padding: 0 12px; font-size: 12px; line-height: 16px; border-radius: var(--radius-small); }\n.df-btn-md { height: 40px; min-width: 80px; padding: 0 16px; font-size: 14px; line-height: 20px; border-radius: var(--radius-medium); }\n.df-btn-lg { height: 48px; min-width: 96px; padding: 0 24px; font-size: 16px; line-height: 24px; border-radius: var(--radius-large); gap: 12px; }\n.df-btn-icon.df-btn-sm { width: 32px; min-width: 32px; padding: 0; }\n.df-btn-icon.df-btn-md { width: 40px; min-width: 40px; padding: 0; }\n.df-btn-icon.df-btn-lg { width: 48px; min-width: 48px; padding: 0; }\n.df-btn-full { width: 100%; }\n.df-btn .df-btn-label { overflow: hidden; text-overflow: ellipsis; }\n/* solid */\n.df-btn-solid { color: var(--c-fg); background: var(--c); }\n.df-btn-solid:hover { opacity: .8; }\n/* bordered — border-medium = 2px */\n.df-btn-bordered { background: transparent; border: 2px solid var(--c-border); color: var(--c-text); }\n.df-btn-bordered:hover { opacity: .8; }\n/* light */\n.df-btn-light { background: transparent; color: var(--c-text); }\n.df-btn-light:hover { background: color-mix(in srgb, var(--c) 20%, transparent); }\n.df-btn-light.c-default:hover { background: color-mix(in srgb, var(--default) 40%, transparent); }\n/* flat */\n.df-btn-flat { background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c-flat); }\n.df-btn-flat.c-default { background: color-mix(in srgb, var(--default) 40%, transparent); }\n.df-btn-flat:hover { opacity: .8; }\n.c-default { --c: var(--default); --c-fg: var(--default-foreground); --c-border: var(--default); --c-text: var(--foreground); --c-flat: var(--default-700); }\n.df-btn-light.c-default { --c-text: var(--default-foreground); }\n.c-primary { --c: var(--primary); --c-fg: var(--primary-foreground); --c-border: var(--primary); --c-text: var(--primary); --c-flat: var(--primary-600); }\n.c-secondary { --c: var(--secondary); --c-fg: var(--secondary-foreground); --c-border: var(--secondary); --c-text: var(--secondary); --c-flat: var(--secondary-600); }\n.c-success { --c: var(--success); --c-fg: var(--success-foreground); --c-border: var(--success); --c-text: var(--success); --c-flat: var(--success-700); }\n.c-warning { --c: var(--warning); --c-fg: var(--warning-foreground); --c-border: var(--warning); --c-text: var(--warning); --c-flat: var(--warning-700); }\n.c-danger { --c: var(--danger); --c-fg: var(--danger-foreground); --c-border: var(--danger); --c-text: var(--danger); --c-flat: var(--danger-600); }\n.df-spinner { width: 1em; height: 1em; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: df-spin .8s linear infinite; display: inline-block; }\n@keyframes df-spin { to { transform: rotate(360deg); } }\n\n/* ButtonGroup (ViewModeButtonGroup, DatePresetPills) */\n.df-btn-group { display: inline-flex; border-radius: var(--radius-small); overflow: hidden; }\n.df-btn-group > .df-btn { border-radius: 0; }\n\n/* Chip — HeroUI v2 */\n.df-chip { display: inline-flex; align-items: center; max-width: fit-content; white-space: nowrap; border-radius: 9999px; height: 24px; padding: 0 4px; font-size: 12px; line-height: 16px; flex-shrink: 0; box-sizing: border-box; }\n.df-chip > .df-chip-content { padding: 0 4px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }\n.df-chip-md { height: 28px; font-size: 14px; }\n.df-chip-md > .df-chip-content { padding: 0 8px; }\n.df-chip-radius-sm { border-radius: var(--radius-small); }\n.df-chip .df-icon { margin: 0 2px; }\n.df-chip-solid { background: var(--c); color: var(--c-fg); }\n.df-chip-flat { background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c-flat); }\n.df-chip-flat.c-default { background: color-mix(in srgb, var(--default) 40%, transparent); color: var(--default-700); }\n.df-chip-bordered { border: 2px solid var(--c-border); color: var(--c-text); background: transparent; }\n.df-chip-light { color: var(--c-text); background: transparent; }\n.df-chip-dot { border: 2px solid var(--default); color: var(--foreground); }\n.df-chip-dot::before { content: \"\"; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin: 0 2px 0 4px; }\n.df-chip-close { display: inline-flex; cursor: pointer; opacity: .7; }\n\n/* Input bordered (label interna flutuante), underlined, flat */\n.df-field { display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0; }\n.df-input { position: relative; width: 100%; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: var(--radius-medium); background: transparent; border: 2px solid var(--default-200); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); transition: border-color .15s; }\n.df-input:hover { border-color: var(--default-400); }\n.df-input:focus-within { border-color: var(--default-foreground); }\n.df-input.has-label { height: 56px; padding-top: 8px; padding-bottom: 8px; flex-direction: row; align-items: flex-end; }\n.df-input-sm { min-height: 32px; border-radius: var(--radius-small); }\n.df-input-sm.has-label { height: 48px; padding-top: 4px; padding-bottom: 4px; }\n.df-input-sm .df-input-label { top: 5px; line-height: 14px; }\n.df-input.has-label input, .df-input.has-label > span:not(.df-input-label):not(.df-input-adorn) { line-height: 20px; }\n.df-input input, .df-input textarea { font: inherit; font-size: 14px; color: var(--foreground); background: transparent; border: 0; outline: none; width: 100%; min-width: 0; padding: 0; }\n.df-input input::placeholder, .df-input textarea::placeholder { color: var(--foreground-500); }\n.df-input textarea { resize: none; line-height: 20px; padding: 8px 0; }\n.df-input-label { position: absolute; left: 12px; top: 8px; font-size: 12px; line-height: 16px; color: var(--default-600); pointer-events: none; white-space: nowrap; }\n.df-input-label .req { color: var(--danger); margin-left: 2px; }\n.df-input-adorn { display: inline-flex; align-items: center; gap: 4px; color: var(--default-400); flex-shrink: 0; font-size: 14px; }\n/* Unidade solta do DataCard control=\"input\" (cards.jsx); o campo de formulário usa FieldAdornment */\n.df-input-end-unit { color: var(--default-400); font-size: 12px; }\n/* FieldAdornment: unidade/prefixo display-only (typeScale bodyMedium; sm = bodySmall) */\n.df-field-adornment { flex-shrink: 0; font-size: 14px; line-height: 1; color: var(--default-400); }\n.df-field-adornment.is-sm { font-size: 12px; }\n.df-input.is-disabled .df-field-adornment { color: var(--default-300); }\n.df-input.is-invalid .df-field-adornment { color: var(--danger-500); }\n.df-input.is-readonly { cursor: default; }\n.df-input.is-disabled { opacity: .5; }\n/* isInvalid (HeroUI): bordered → borda danger também em hover/foco; rótulo e texto digitado em danger */\n.df-input.is-invalid, .df-input.is-invalid:hover, .df-input.is-invalid:focus-within { border-color: var(--danger); }\n.df-input.is-invalid .df-input-label, .df-input.is-invalid input, .df-input.is-invalid textarea { color: var(--danger); }\n.df-input-flat.is-invalid, .df-input-flat.is-invalid:hover { background: var(--danger-50); }\n.df-input-underlined.is-invalid, .df-input-underlined.is-invalid:hover, .df-input-underlined.is-invalid:focus-within { border-bottom-color: var(--danger); }\n/* color=\"warning\" (NumericField compacto, aviso de plausibilidade): borda só no foco */\n.df-input.is-warning:focus-within { border-color: var(--warning); }\n.df-input-flat { border: 0; background: var(--default-100); box-shadow: none; }\n.df-input-flat:hover { background: var(--default-200); }\n.df-input-underlined { border: 0; border-radius: 0; box-shadow: 0 1px 0 0 rgb(0 0 0 / .05); border-bottom: 2px solid var(--default-200); padding: 0 4px; }\n.df-input-underlined:hover { border-bottom-color: var(--default-400); }\n.df-input-underlined:focus-within { border-bottom-color: var(--primary); }\n.df-field-helper { font t:600}\n.au-fig,.au-rule,.au-q>.au-full{grid-column:1 / -1}\n.au-fig{position:relative;margin:0;border:1.5px solid var(--line);border-radius:20px;padding:48px 36px 36px;background-color:#fff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;min-width:0}\n.au-plq{position:absolute;top:-12px;left:28px;background:var(--ink);color:#fff;font:500 11px/24px var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:0 12px;border-radius:6px;white-space:nowrap;max-width:calc(100% - 56px);overflow:hidden;text-overflow:ellipsis}\n.au-rule{margin:0;padding:4px 0 4px 22px;border-left:5px solid var(--nome);font:italic 400 clamp(24px,3vw,32px)/1.22 var(--serif);max-width:960px;text-wrap:balance}\n.au-src{margin:14px 0 0;font:500 11px/1.6 var(--mono);color:var(--faint);letter-spacing:.02em}\n.au-src a{color:var(--mute)}\n\n/* destinos */\n.au-dest{display:inline-flex;align-self:flex-start;font:700 12px/24px var(--sans);letter-spacing:.07em;text-transform:uppercase;padding:0 10px;border-radius:6px;color:#fff;background:var(--ink);white-space:nowrap}\n.au-dest.nome,.nome>.au-dest{background:var(--nome)}\n.au-dest.prep,.prep>.au-dest{background:var(--prep)}\n.au-dest.com,.com>.au-dest{background:var(--com)}\n.au-dest.nada,.nada>.au-dest{background:var(--nada)}\n\n/* fig 1 · três registros */\n.au-reg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}\n.au-reg{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px;box-shadow:5px 5px 0 var(--ink);min-width:0}\n.au-who{font:400 32px/1 var(--serif)}\n.au-code{font:500 32px/1 var(--mono);letter-spacing:-.03em;margin-top:14px}\n.au-code.txt{font:400 34px/1 var(--serif);letter-spacing:0}\n.au-regname{font-size:15px;line-height:1.35;color:var(--mute);min-height:42px}\n.au-axes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}\n.au-axes span{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.25;display:flex;flex-direction:column;background:var(--paper);min-width:0}\n.au-axes i{font:500 10px/1.6 var(--mono);font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}\n.au-axes .hot{border-color:var(--nome);background:var(--nome-bg)}\n.au-axes .hot i{color:var(--nome)}\n.au-axes .off{border-style:dashed;color:var(--faint);background:transparent}\n.au-down{display:flex;justify-content:center;gap:120px;padding:20px 0 8px;font:400 22px/1 var(--serif);color:var(--faint)}\n.au-order{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:14px;padding:18px 24px}\n.au-order b{font:400 38px/1 var(--serif)}\n.au-order span{font:500 11px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;opacity:.72}\n\n/* fig 2 · um código, três leituras */\n.au-fork{display:grid;grid-template-columns:minmax(0,1fr) 88px minmax(0,1.25fr);align-items:center;row-gap:10px;max-width:880px;margin:0 auto}\n.au-fork>.au-mono{align-self:end}\n.au-col{display:flex;flex-direction:column;gap:12px;min-width:0}\n.au-box{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;min-width:0}\n.au-box b{font:500 20px/1 var(--mono);letter-spacing:-.02em;flex:none}\n.au-box span{font-size:16px;line-height:1.15;min-width:0}\n.au-mid{position:relative;height:192px}\n.au-mid::before{content:\"\";position:absolute;left:0;top:50%;width:44px;border-top:2px solid var(--ink)}\n.au-mid::after{content:\"\";position:absolute;left:44px;right:0;top:28px;bottom:28px;border:2px solid var(--ink);border-right:0;border-radius:12px 0 0 12px}\n.au-mid i{position:absolute;left:44px;right:0;top:50%;border-top:2px solid var(--ink)}\n.au-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px;padding-top:28px;border-top:1.5px dashed var(--line)}\n.au-stat{display:flex;align-items:center;gap:16px;min-width:0}\n.au-stat b{font:400 96px/.8 var(--serif);flex:none}\n.au-stat span{font-size:16px;line-height:1.3;color:var(--mute)}\n.au-stat.zero b{color:var(--bad)}\n\n/* fig 3 · a régua */\n.au-rl{display:grid;grid-template-columns:240px minmax(0,1fr) 190px;gap:28px;align-items:center;padding:54px 0 40px}\n.au-rl+.au-rl{border-top:1.5px dashed var(--line)}\n.au-rlh b{font:400 32px/1 var(--serif);display:block}\n.au-rlh span{display:inline-block;margin:8px 6px 0 0;font:500 11px/22px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:0 9px;border-radius:5px;background:var(--ink);color:#fff}\n.au-ruler{position:relative;height:20px;border-radius:10px;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--nome-bg) 0 var(--cut),var(--bad-bg) var(--cut) 100%)}\n.au-ruler.inv{background:linear-gradient(90deg,var(--bad-bg) 0 var(--cut),var(--nome-bg) var(--cut) 100%)}\n.au-ruler::after{content:\"\";position:absolute;inset:0;border-radius:9px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(22,24,21,.22) calc(10% - 1px) 10%);pointer-events:none}\n.au-cut{position:absolute;top:-9px;bottom:-9px;width:0;border-left:2.5px solid var(--ink);z-index:1}\n.au-cut b{position:absolute;top:calc(100% + 5px);left:0;transform:translateX(-50%);font:500 13px/1 var(--mono);white-space:nowrap}\n.au-pin{position:absolute;top:-42px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}\n.au-pin b{background:var(--ink);color:#fff;font:500 13px/26px var(--mono);padding:0 9px;border-radius:6px;white-space:nowrap}\n.au-pin::after{content:\"\";width:2.5px;height:38px;background:var(--ink)}\n.au-ends{display:flex;justify-content:space-between;margin-top:8px;font:500 11px/1 var(--mono);color:var(--faint)}\n.au-vd{font:600 16px/1.2 var(--sans);padding:10px 12px;border-radius:10px;text-align:center}\n.au-vd.ok{background:var(--nome-bg);color:var(--nome)}\n.au-vd.bad{background:var(--bad-bg);color:var(--bad)}\n.au-vd.eq{background:var(--nada-bg);color:var(--ink)}\n\n/* fig 4 · a plaquinha */\n.au-std{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;border:1.5px dashed var(--nada);border-radius:12px;background:rgba(255,255,255,.75);margin-bottom:28px}\n.au-std b{font:500 11px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-right:6px}\n.au-std span{font-size:15px;padding:3px 11px;border-radius:999px;background:var(--nada-bg);color:var(--mute)}\n.au-plates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}\n.au-plate{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}\n.au-pl{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;font:400 25px/1.1 var(--serif);min-width:0;max-width:100%}\n.au-pl span{padding:9px 14px}\n.au-pl .mk{background:var(--nome);color:#fff}\n.au-pl .no{border-left:1.5px dashed var(--line);color:var(--faint);font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center}\n.au-plate i{font:500 11px/1 var(--mono);font-style:normal;text-transform:uppercase;letter-spacing:.07em;color:var(--nome)}\n.au-never{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline;margin-top:28px;padding-top:20px;border-top:1.5px dashed var(--line)}\n.au-never s{font:400 26px/1.1 var(--serif);color:var(--bad);text-decoration-thickness:2px}\n.au-never span{font-size:16px;color:var(--mute)}\n\n/* fig 5 · palavra × régua */\n.au-vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}\n.au-vsp{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:24px 22px 22px;display:flex;flex-direction:column;min-width:0}\n.au-vst{display:grid;grid-template-columns:1fr 1fr;gap:12px;justify-items:center;align-items:end}\n.au-lab{font:400 24px/1.1 var(--serif);border:1.5px solid var(--ink);border-radius:10px;padding:8px 14px;background:var(--paper);text-align:center}\n.au-join{margin:0 25%;position:relative}\n.au-join.merge{height:26px;border:2px solid var(--ink);border-top:0;border-radius:0 0 12px 12px;margin-bottom:20px}\n.au-join.merge::after{content:\"\";position:absolute;left:50%;top:100%;height:20px;border-left:2px solid var(--ink);margin-left:-1px}\n.au-join.split{height:46px;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}\n.au-vsr{display:grid;gap:12px}\n.au-vsr.two{grid-template-columns:1fr 1fr}\n.au-vsr.one{grid-template-columns:minmax(0,62%);justify-content:center}\n.au-mini{height:16px;border-radius:8px;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--nome-bg) 0 58%,var(--bad-bg) 58%)}\n.au-mini.b{background:linear-gradient(90deg,var(--nome-bg) 0 24%,var(--com-bg) 24% 50%,var(--bad-bg) 50%)}\n.au-minil{font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:center;margin-top:7px}\n.au-vsv{margin-top:22px;padding-top:16px;border-top:1.5px dashed var(--line);display:flex;flex-direction:column;gap:8px}\n.au-vsv b{font:600 19px/1.25 var(--sans)}\n.au-ev{font:500 11.5px/1.7 var(--mono);color:var(--mute)}\n.au-seal{display:inline-block;font:500 10px/18px var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:0 7px;border:1px solid currentColor;border-radius:4px;color:var(--com);margin-right:6px;white-space:nowrap}\n\n/* fig 6 · quem cumpre × quantas vezes */\n.au-mx{display:grid;grid-template-columns:150px repeat(2,minmax(0,1fr));gap:12px}\n.au-mxh{align-self:end;padding:0 4px 2px;font:500 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}\n.au-mxh b{color:var(--ink)}\n.au-mxr{align-self:center;font:400 27px/1.05 var(--serif)}\n.au-mxr small{display:block;font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-top:5px}\  U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2pL7W0Q5n-wU.woff2) format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa25L7W0Q5n-wU.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"357a3782-ead3-4867-b2d9-8ac6b7bfba21\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#FAF9F5}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"au\" data-canvas-width=\"1600\" data-canvas-height=\"8000\" data-document-role=\"page\" data-label=\"Aula · o que é um exame\"><div class=\"au-wrap\">\n\n<header class=\"au-cover\">\n<span class=\"au-mono\">Aula · Exames · 9 de novembro de 2026<\u002Fspan>\n<h1>O que é um exame<\u002Fh1>\n<p class=\"au-lede\">Doze quadros, uma pergunta por vez. No nono, <b>três perguntas decidem onde mora cada informação de um pedido<\u002Fb>. No último, está na tela.<\u002Fp>\n<nav class=\"au-nav\" aria-label=\"Páginas\"><a class=\"on\" href=\"Main.dc.html\">Aula<\u002Fa><a href=\"NaTela.dc.html\">Na tela<\u002Fa><a href=\"Pesquisa.dc.html\">Evidências<\u002Fa><\u002Fnav>\n<nav class=\"au-trail\" aria-label=\"Quadros da aula\">\n<a href=\"#q1\"><b>1<\u002Fb>Onde o exame mora<\u002Fa>\n<a href=\"#q2\"><b>2<\u002Fb>“Glicose” é um exame?<\u002Fa>\n<a href=\"#q3\"><b>3<\u002Fb>A régua<\u002Fa>\n<a href=\"#q4\"><b>4<\u002Fb>O que entra no nome<\u002Fa>\n<a href=\"#q5\"><b>5<\u002Fb>Sinônimo ou outro exame<\u002Fa>\n<a href=\"#q6\"><b>6<\u002Fb>Quem cumpre<\u002Fa>\n<a href=\"#q7\"><b>7<\u002Fb>O jejum<\u002Fa>\n<a href=\"#q8\"><b>8<\u002Fb>As horas<\u002Fa>\n<a href=\"#q9\"><b>9<\u002Fb>O algoritmo<\u002Fa>\n<a href=\"#q10\"><b>10<\u002Fb>Prova real<\u002Fa>\n<a href=\"#q11\"><b>11<\u002Fb>A ficha<\u002Fa>\n<a href=\"#q12\"><b>12<\u002Fb>Na tela<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<section class=\"au-q\" id=\"q1\">\n<span class=\"au-n\" aria-hidden=\"true\">1<\u002Fspan>\n<h2>Onde um exame mora, oficialmente?<\u002Fh2>\n<p class=\"au-a\">Em três registros. <b>Cada um responde a uma pergunta diferente<\u002Fb> sobre a mesma glicemia.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 1 — três registros, uma glicemia<\u002Ffigcaption>\n<div class=\"au-reg3\">\n<article class=\"au-reg\">\n<span class=\"au-who\">Quem mede<\u002Fspan>\n<span class=\"au-mono\">LOINC · dicionário mundial dos laboratórios<\u002Fspan>\n<b class=\"au-code\">1558-6<\u002Fb>\n<span class=\"au-regname\">Fasting glucose [Mass/volume] in Serum or Plasma<\u002Fspan>\n<div class=\"au-axes\">\n<span><i>componente<\u002Fi>Glicose<\u002Fspan>\n<span class=\"hot\"><i>condição<\u002Fi>após jejum<\u002Fspan>\n<span><i>grandeza<\u002Fi>massa por volume<\u002Fspan>\n<span><i>tempo<\u002Fi>um instante<\u002Fspan>\n<span><i>amostra<\u002Fi>soro ou plasma<\u002Fspan>\n<span><i>escala<\u002Fi>número<\u002Fspan>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"au-reg\">\n<span class=\"au-who\">Quem paga<\u002Fspan>\n<span class=\"au-mono\">TUSS · tabela dos planos de saúde, da ANS<\u002Fspan>\n<b class=\"au-code\">40302040<\u002Fb>\n<span class=\"au-regname\">Glicose - pesquisa e/ou dosagem<\u002Fspan>\n<div class=\"au-axes\">\n<span><i>componente<\u002Fi>Glicose<\u002Fspan>\n<span class=\"off\"><i>condição<\u002Fi>não diz<\u002Fspan>\n<span class=\"off\"><i>amostra<\u002Fi>não diz<\u002Fspan>\n<span class=\"off\"><i>escala<\u002Fi>não diz<\u002Fspan>\n<\u002Fdiv>\n<\u002Farticle>\n<article class=\"au-reg\">\n<span class=\"au-who\">Quem colhe<\u002Fspan>\n<span class=\"au-mono\">Laboratório · folha de instrução da coleta<\u002Fspan>\n<b class=\"au-code txt\">Glicemia de jejum<\u002Fb>\n<span class=\"au-regname\">“Manter jejum de 8-12 horas. Água é permitida.”<\u002Fspan>\n<div class=\"au-axes\">\n<span class=\"hot\"><i>o paciente cumpre<\u002Fi>jejum<\u002Fspan>\n<span class=\"off\"><i>código<\u002Fi>o da casa<\u002Fspan>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<div class=\"au-down\" aria-hidden=\"true\"><span>↓<\u002Fspan><span>↓<\u002Fspan><span>↓<\u002Fspan><\u002Fdiv>\n<div class=\"au-order\"><span>O pedido do nutricionista<\u002Fspan><b>Glicemia de Jejum<\u002Fb><span>uma linha que precisa servir aos três<\u002Fspan><\u002Fdiv>\n<\u002Ffigure>\n<p class=\"au-rule\">Nenhum dos três é o pedido. O pedido é a linha que você escreve, e ela conversa com os três.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q2\">\n<span class=\"au-n\" aria-hidden=\"true\">2<\u002Fspan>\n<h2>“Glicose” é um exame?<\u002Fh2>\n<p class=\"au-a\">Para quem paga, é <b>um<\u002Fb>. Para quem mede, são <b>três<\u002Fb>.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 2 — um código de cobrança, três medidas<\u002Ffigcaption>\n<div class=\"au-fork\">\n<span class=\"au-mono\">TUSS · quem paga<\u002Fspan><span><\u002Fspan><span class=\"au-mono\">LOINC · quem mede<\u002Fspan>\n<div class=\"au-box\"><b>40302040<\u002Fb><span>Glicose<\u002Fspan><\u002Fdiv>\n<div class=\"au-mid\" aria-hidden=\"true\"><i><\u002Fi><\u002Fdiv>\n<div class=\"au-col\">\n<div class=\"au-box\"><b>1558-6<\u002Fb><span>em jejum<\u002Fspan><\u002Fdiv>\n<div class=\"au-box\"><b>1521-4<\u002Fb><span>2 h após a refeição<\u002Fspan><\u002Fdiv>\n<div class=\"au-box\"><b>2345-7<\u002Fb><span>sem condição declarada<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"au-stats\">\n<div class=\"au-stat\"><b>1<\u002Fb><span>código na tabela de quem paga<\u002Fspan><\u002Fdiv>\n<div class=\"au-stat\"><b>3<\u002Fb><span>códigos no dicionário de quem mede<\u002Fspan><\u002Fdiv>\n<div class=\"au-stat zero\"><b>0<\u002Fb><span>procedimentos da TUSS com “jejum” no nome<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffigure>\n<p class=\"au-rule\">O pedido segue quem lê o resultado: separa dois exames só quando a leitura separa.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q3\">\n<span class=\"au-n\" aria-hidden=\"true\">3<\u002Fspan>\n<h2>O que separa um exame do outro?<\u002Fh2>\n<p class=\"au-a\">A <b>régua<\u002Fb>: a faixa que diz se o número está bom. O mesmo sangue, o mesmo número, e a leitura vira.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 3 — 160 mg/dL em duas réguas<\u002Ffigcaption>\n<div class=\"au-rl\">\n<div class=\"au-rlh\"><b>Triglicerídeos<\u002Fb><span>sem jejum<\u002Fspan><\u002Fdiv>\n<div><div class=\"au-ruler\" style=\"--cut:58.33%\"><span class=\"au-pin\" style=\"left:53.33%\"><b>160<\u002Fb><\u002Fspan><span class=\"au-cut\" style=\"left:58.33%\"><b>175<\u002Fb><\u002Fspan><\u002Fdiv><div class=\"au-ends\"><span>0<\u002Fspan><span>300 mg/dL<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<span class=\"au-vd ok\">dentro do desejável<\u002Fspan>\n<\u002Fdiv>\n<div class=\"au-rl\">\n<div class=\"au-rlh\"><b>Triglicerídeos<\u002Fb><span>em jejum de 12 h<\u002Fspan><\u002Fdiv>\n<div><div class=\"au-ruler\" style=\"--cut:50%\"><span class=\"au-pin\" style=\"left:53.33%\"><b>160<\u002Fb><\u002Fspan><span class=\"au-cut\" style=\"left:50%\"><b>150<\u002Fb><\u002Fspan><\u002Fdiv><div class=\"au-ends\"><span>0<\u002Fspan><span>300 mg/dL<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<span class=\"au-vd bad\">acima do desejável<\u002Fspan>\n<\u002Fdiv>\n<div class=\"au-rl\">\n<div class=\"au-rlh\"><b>HDL-Colesterol<\u002Fb><span>sem jejum<\u002Fspan><span>em jejum<\u002Fspan><\u002Fdiv>\n<div><div class=\"au-ruler inv\" style=\"--cut:40%\"><span class=\"au-cut\" style=\"left:40%\"><b>40<\u002Fb><\u002Fspan><\u002Fdiv><div class=\"au-ends\"><span>0<\u002Fspan><span>100 mg/dL<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<span class=\"au-vd eq\">uma régua só<\u002Fspan>\n<\u002Fdiv>\n<p class=\"au-src\">Consenso Brasileiro para a Normatização da Determinação Laboratorial do Perfil Lipídico, 2016 · valores de adultos<\u002Fp>\n<\u002Ffigure>\n<p class=\"au-rule\">Exame é um nome com uma régua. Mudou a régua, é outro exame. Não mudou, é o mesmo.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q4\">\n<span class=\"au-n\" aria-hidden=\"true\">4<\u002Fspan>\n<h2>Então, o que entra no nome?<\u002Fh2>\n<p class=\"au-a\">A substância medida e <b>só o que foge do padrão<\u002Fb>. O padrão ninguém escreve.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 4 — a plaquinha: o que se mede + o que foge do padrão<\u002Ffigcaption>\n<div class=\"au-std\"><b>O padrão<\u002Fb><span>sangue<\u002Fspan><span>uma coleta<\u002Fspan><span>qualquer hora<\u002Fspan><span>sem jejum<\u002Fspan><span>método de rotina<\u002Fspan><\u002Fdiv>\n<div class=\"au-plates\">\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Glicemia<\u002Fspan><span class=\"mk\">de Jejum<\u002Fspan><\u002Fspan><i>condição<\u002Fi><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Glicemia<\u002Fspan><span class=\"mk\">pós-prandial<\u002Fspan><\u002Fspan><i>condição<\u002Fi><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Triglicerídeos<\u002Fspan><span class=\"mk\">em jejum de 12h<\u002Fspan><\u002Fspan><i>condição<\u002Fi><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Cortisol<\u002Fspan><span class=\"mk\">Matinal<\u002Fspan><\u002Fspan><i>hora<\u002Fi><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Cortisol<\u002Fspan><span class=\"mk\">Salivar Noturno<\u002Fspan><\u002Fspan><i>amostra e hora<\u002Fi><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Cortisol<\u002Fspan><span class=\"mk\">Urinário 24h<\u002Fspan><\u002Fspan><i>amostra e duração<\u002Fi><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>PCR<\u002Fspan><span class=\"mk\">Ultrassensível<\u002Fspan><\u002Fspan><i>método<\u002Fi><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Testosterona<\u002Fspan><span class=\"mk\">Livre<\u002Fspan><\u002Fspan><i>fração<\u002Fi><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>HDL-Colesterol<\u002Fspan><span class=\"no\">nada foge<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>TSH<\u002Fspan><span class=\"no\">nada foge<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"au-never\"><s>HDL sem jejum<\u002Fs><s>Glicemia no sangue<\u002Fs><s>TSH no soro<\u002Fs><span>Escrever o padrão é dizer “glicemia, não nas fezes”.<\u002Fspan><\u002Fdiv>\n<p class=\"au-src\">Nomes como estão no catálogo do sistema.<\u002Fp>\n<\u002Ffigure>\n<p class=\"au-rule\">O nome mínimo completo: tire uma palavra e vira outro exame; ponha uma e está repetindo o padrão.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q5\">\n<span class=\"au-n\" aria-hidden=\"true\">5<\u002Fspan>\n<h2>E quando a palavra existe, mas a régua é a mesma?<\u002Fh2>\n<p class=\"au-a\">É <b>sinônimo<\u002Fb>: serve para achar o exame, não para criar outro.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 5 — duas palavras, quantas réguas?<\u002Ffigcaption>\n<div class=\"au-vs\">\n<div class=\"au-vsp\">\n<div class=\"au-vst\"><span class=\"au-lab\">TSH<\u002Fspan><span class=\"au-lab\">TSH ultrassensível<\u002Fspan><\u002Fdiv>\n<div class=\"au-join merge\" aria-hidden=\"true\"><\u002Fdiv>\n<div class=\"au-vsr one\"><div><div class=\"au-mini\"><\u002Fdiv><div class=\"au-minil\">uma régua<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"au-vsv\"><span class=\"au-dest nada\">Sinônimo<\u002Fspan><b>Um exame. A segunda palavra vira termo de busca.<\u002Fb>\n<span class=\"au-ev\">TUSS 40316521: um código, sem “ultrassensível”<br>catálogo: um exame, TSH<br><span class=\"au-seal\">inferência<\u002Fspan>a faixa de referência é a mesma<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"au-vsp\">\n<div class=\"au-vst\"><span class=\"au-lab\">PCR<\u002Fspan><span class=\"au-lab\">PCR ultrassensível<\u002Fspan><\u002Fdiv>\n<div class=\"au-join split\" aria-hidden=\"true\"><\u002Fdiv>\n<div class=\"au-vsr two\"><div><div class=\"au-mini\"><\u002Fdiv><div class=\"au-minil\">inflamação<\u002Fdiv><\u002Fdiv><div><div class=\"au-mini b\"><\u002Fdiv><div class=\"au-minil\">risco cardiovascular<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"au-vsv\"><span class=\"au-dest nome\">Nome<\u002Fspan><b>Dois exames. A marca entra no nome.<\u002Fb>\n<span class=\"au-ev\">LOINC 1988-5 × 30522-7, “by High sensitivity method”<br>catálogo: PCR Convencional e PCR Ultrassensível<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffigure>\n<p class=\"au-rule\">Troquei um pelo outro no laudo. A leitura muda? Não: sinônimo. Sim: outro exame.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q6\">\n<span class=\"au-n\" aria-hidden=\"true\">6<\u002Fspan>\n<h2>E o que não muda a régua, mas alguém precisa saber?<\u002Fh2>\n<p class=\"au-a\">Depende de <b>quem cumpre<\u002Fb> e de <b>quantas vezes vale<\u002Fb>.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 6 — quem cumpre × quantas vezes vale<\u002Ffigcaption>\n<div class=\"au-mx\">\n<span class=\"au-mxh\"><\u002Fspan>\n<span class=\"au-mxh\">vale <b>toda vez<\u002Fb> que se faz este exame<\u002Fspan>\n<span class=\"au-mxh\">vale <b>só neste pedido<\u002Fb><\u002Fspan>\n<span class=\"au-mxr\">O paciente<small>cumpre<\u002Fsmall><\u002Fspan>\n<div class=\"au-cell prep\"><span class=\"au-dest\">Preparo<\u002Fspan><div class=\"au-chips\"><span>Jejum 8 h<\u002Fspan><span>Coleta das 7 h às 9 h<\u002Fspan><span>Primeira urina da manhã<\u002Fspan><span>Coleta de 24 h<\u002Fspan><span>Repouso 30 min<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-cell com\"><span class=\"au-dest\">Comentário<\u002Fspan><div class=\"au-chips\"><span>“Colher no 3º dia do ciclo.”<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<span class=\"au-mxr\">O laboratório<small>executa<\u002Fsmall><\u002Fspan>\n<div class=\"au-cell nada\"><span class=\"au-dest\">Não se escreve<\u002Fspan><div class=\"au-chips\"><span>tubo<\u002Fspan><span>centrífuga<\u002Fspan><span>soro ou plasma<\u002Fspan><span>método de rotina<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-cell com\"><span class=\"au-dest\">Comentário<\u002Fspan><div class=\"au-chips\"><span>“Com diluição.”<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"au-drawers\">\n<div class=\"au-drawer\"><code>code<\u002Fcode><span>o que se pede<\u002Fspan><span class=\"au-dest nome\">Nome<\u002Fspan><\u002Fdiv>\n<div class=\"au-drawer\"><code>patientInstruction<\u002Fcode><span>instrução ao paciente<\u002Fspan><span class=\"au-dest prep\">Preparo<\u002Fspan><\u002Fdiv>\n<div class=\"au-drawer\"><code>orderDetail · note<\u002Fcode><span>detalhe do pedido e comentário<\u002Fspan><span class=\"au-dest com\">Comentário<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"au-src\">As três gavetas são do padrão internacional de pedido de exame: FHIR R4, recurso ServiceRequest.<\u002Fp>\n<\u002Ffigure>\n<p class=\"au-rule\">Preparo é o que faz o paciente perder a viagem. O resto é comentário, ou não se escreve.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q7\">\n<span class=\"au-n\" aria-hidden=\"true\">7<\u002Fspan>\n<h2>E o jejum, mora onde?<\u002Fh2>\n<p class=\"au-a\">Em dois endereços. No terceiro, ele <b>não entra<\u002Fb>.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 7 — os endereços do jejum<\u002Ffigcaption>\n<div class=\"au-addr\">\n<div class=\"au-addri nome\"><span class=\"au-dest\">No nome<\u002Fspan><p>a palavra, quando muda a régua<\u002Fp>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Triglicerídeos<\u002Fspan><span class=\"mk\">em jejum de 12h<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"au-plate\"><span class=\"au-pl\"><span>Glicemia<\u002Fspan><span class=\"mk\">de Jejum<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-addri prep\"><span class=\"au-dest\">No preparo<\u002Fspan><p>as horas que o paciente cumpre<\u002Fp>\n<div class=\"au-kv\"><span>Glicemia de Jejum<\u002Fspan><b>Jejum 8 h<\u002Fb><\u002Fdiv>\n<div class=\"au-kv\"><span>Ferritina<\u002Fspan><b>Jejum 8 h<\u002Fb><\u002Fdiv>\n<div class=\"au-kv\"><span>Insulina Basal<\u002Fspan><b>Jejum 8 h<\u002Fb><\u002Fdiv>\n<div class=\"au-kv\"><span>Triglicerídeos em jejum de 12h<\u002Fspan><b>Jejum 12 h<\u002Fb><\u002Fdiv><\u002Fdiv>\n<div class=\"au-addri nada\"><span class=\"au-dest\">Em lugar nenhum<\u002Fspan><p>“sem jejum” é o padrão<\u002Fp>\n<div class=\"au-kv\"><span>HDL-Colesterol<\u002Fspan><s>Sem jejum<\u002Fs><\u002Fdiv>\n<div class=\"au-kv\"><span>TSH<\u002Fspan><s>Sem jejum<\u002Fs><\u002Fdiv>\n<div class=\"au-kv\"><span>Hemoglobina Glicada<\u002Fspan><s>Sem jejum<\u002Fs><\u002Fdiv>\n<div class=\"au-kv\"><span>Hemograma Completo<\u002Fspan><s>Sem jejum<\u002Fs><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"au-dotsw\">\n<div class=\"au-dots\" role=\"img\" aria-label=\"273 exames: 79 exigem algo do paciente, 194 não exigem nada\"><sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"78\"><i class=\"{{ d.c }}\"><\u002Fi><\u002Fsc-for><\u002Fdiv>\n<div class=\"au-leg\">\n<div class=\"au-legi on\"><b>79<\u002Fb><span><b>exigem algo do paciente.<\u002Fb> Só jejum de 8 h: 54 · coleta de 24 h: 11 · primeira urina da manhã: 6 · hora marcada: 6 · outros: 2<\u002Fspan><\u002Fdiv>\n<div class=\"au-legi off\"><b>194<\u002Fb><span><b>não exigem nada.<\u002Fb> A condição fica vazia: basta comparecer.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"au-src\">Os 273 exames do catálogo do sistema, pela condição usual de cada um.<\u002Fp>\n<\u002Ffigure>\n<p class=\"au-rule\">A palavra vai no nome se muda a régua. As horas vão no preparo. “Sem jejum” não vai a lugar nenhum.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q8\">\n<span class=\"au-n\" aria-hidden=\"true\">8<\u002Fspan>\n<h2>Oito, dez, doze ou catorze horas: quem manda?<\u002Fh2>\n<p class=\"au-a\">Três degraus. <b>O de cima vence.<\u002Fb><\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 8 — os três degraus das horas<\u002Ffigcaption>\n<div class=\"au-stairs\">\n<div class=\"au-step s1\"><span class=\"au-mono\">1 · o sistema<\u002Fspan><b>guarda o mínimo de consenso<\u002Fb><div class=\"au-hours\"><span class=\"on\">8 h<\u002Fspan><\u002Fdiv><span>Glicemia de Jejum: pelo menos 8 h sem calorias.<\u002Fspan><\u002Fdiv>\n<div class=\"au-step s2\"><span class=\"au-mono\">2 · o laboratório<\u002Fspan><b>manda nas horas da casa<\u002Fb><div class=\"au-hours\"><span>8 h<\u002Fspan><span>10 h<\u002Fspan><span>12 h<\u002Fspan><span>14 h<\u002Fspan><\u002Fdiv><span>Para o paciente, vale a folha de coleta do laboratório.<\u002Fspan><\u002Fdiv>\n<div class=\"au-step s3\"><span class=\"au-mono\">3 · você<\u002Fspan><b>escreve o que quer diferente<\u002Fb><div class=\"au-hours\"><span>“Jejum de 12 h.”<\u002Fspan><\u002Fdiv><span>No comentário da linha. Se é sempre assim, vira Meu exame.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"au-open\"><span class=\"au-dest nada\">Sem consenso<\u002Fspan><span><b>Repouso da prolactina, abstinência do PSA.<\u002Fb> O sistema não inventa número: vale a folha do laboratório, e quem exige escreve.<\u002Fspan><\u002Fdiv>\n<p class=\"au-src\">Mínimo de 8 h: Sociedade Brasileira de Diabetes. Variação entre casas: folhas de coleta de laboratórios.<\u002Fp>\n<\u002Ffigure>\n<p class=\"au-rule\">O que é consenso o sistema já sabe. O que é da casa ou seu, escreve quem quer diferente.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q9\">\n<span class=\"au-n\" aria-hidden=\"true\">9<\u002Fspan>\n<h2>Qual é a regra, afinal?<\u002Fh2>\n<p class=\"au-a\">Três perguntas, <b>nesta ordem<\u002Fb>. A primeira que der “sim” decide.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 9 — o algoritmo<\u002Ffigcaption>\n<div class=\"au-algo\">\n<span class=\"au-in\">uma informação sobre o exame<\u002Fspan>\n<div class=\"au-no\" aria-hidden=\"true\"><\u002Fdiv>\n<div class=\"au-ask\"><div class=\"au-qb\"><span class=\"n\">1<\u002Fspan><b>Muda a régua?<\u002Fb><span>pelo jeito de medir: jejum, amostra, momento, método<\u002Fspan><\u002Fdiv><div class=\"au-yes\"><b>sim<\u002Fb><\u002Fdiv><div class=\"au-out nome\"><b>NOME<\u002Fb><span>É outro exame.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-no\"><b>não<\u002Fb><\u002Fdiv>\n<div class=\"au-ask\"><div class=\"au-qb\"><span class=\"n\">2<\u002Fspan><b>O paciente perde a viagem se não souber?<\u002Fb><span>e vale toda vez que se faz este exame<\u002Fspan><\u002Fdiv><div class=\"au-yes\"><b>sim<\u002Fb><\u002Fdiv><div class=\"au-out prep\"><b>PREPARO<\u002Fb><span>Campo do exame. Aparece na condição.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-no\"><b>não<\u002Fb><\u002Fdiv>\n<div class=\"au-ask\"><div class=\"au-qb\"><span class=\"n\">3<\u002Fspan><b>Vale só para este pedido?<\u002Fb><span>para este paciente, desta vez<\u002Fspan><\u002Fdiv><div class=\"au-yes\"><b>sim<\u002Fb><\u002Fdiv><div class=\"au-out com\"><b>COMENTÁRIO<\u002Fb><span>Texto livre, na linha.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-no\"><b>não<\u002Fb><\u002Fdiv>\n<div class=\"au-out nada\"><b>NÃO SE ESCREVE<\u002Fb><span>É o padrão do exame ou a rotina do laboratório.<\u002Fspan><\u002Fdiv>\n<div class=\"au-split\" aria-hidden=\"true\"><div>90%<\u002Fdiv><div>10%<\u002Fdiv><\u002Fdiv>\n<div class=\"au-splitl\"><span><b>A regra decide.<\u002Fb> Nome, preparo e silêncio vêm do cadastro.<\u002Fspan><span><b>Você escreve.<\u002Fb> Comentário.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"au-src\">90 e 10 são a proporção que você usou na conversa, não uma medida.<\u002Fp>\n<\u002Ffigure>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q10\">\n<span class=\"au-n\" aria-hidden=\"true\">10<\u002Fspan>\n<h2>Funciona com os casos difíceis?<\u002Fh2>\n<p class=\"au-a\">Dezoito informações, <b>quatro gavetas<\u002Fb>.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 10 — prova real<\u002Ffigcaption>\n<div class=\"au-tri\">\n<div class=\"au-bin nome\"><span class=\"au-dest\">Nome<\u002Fspan>\n<div class=\"au-it\"><b>de jejum<\u002Fb><span>glicemia<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>pós-prandial<\u002Fb><span>glicemia<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>em jejum de 12 h<\u002Fb><span>triglicerídeos<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>ultrassensível<\u002Fb><span>PCR<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>salivar noturno<\u002Fb><span>cortisol<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>livre<\u002Fb><span>testosterona<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-bin prep\"><span class=\"au-dest\">Preparo<\u002Fspan>\n<div class=\"au-it\"><b>jejum de 8 h<\u002Fb><span>ferritina · insulina<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>coleta das 7 h às 9 h<\u002Fb><span>cortisol matinal · testosterona<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>2 h após a refeição<\u002Fb><span>glicemia pós-prandial<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>primeira urina da manhã<\u002Fb><span>microalbuminúria<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>coleta de 24 h<\u002Fb><span>proteínas na urina<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>repouso de 30 min<\u002Fb><span>GH basal<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-bin com\"><span class=\"au-dest\">Comentário<\u002Fspan>\n<div class=\"au-it\"><b>com diluição<\u002Fb><span>testosterona · relato de consultório<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>colher no 3º dia do ciclo<\u002Fb><span>para esta paciente<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>jejum de 12 h<\u002Fb><span>quando o seu número é outro<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-bin nada\"><span class=\"au-dest\">Não se escreve<\u002Fspan>\n<div class=\"au-it\"><b>sem jejum<\u002Fb><span>HDL · TSH · hemograma<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>soro ou plasma<\u002Fb><span>quase todo exame de sangue<\u002Fspan><\u002Fdiv>\n<div class=\"au-it\"><b>ultrassensível<\u002Fb><span>TSH · vira termo de busca<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffigure>\n<p class=\"au-rule\">Variação sem código próprio não vira dropdown: ou muda a régua e ganha nome, ou é comentário.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q11\">\n<span class=\"au-n\" aria-hidden=\"true\">11<\u002Fspan>\n<h2>Como fica a ficha de um exame?<\u002Fh2>\n<p class=\"au-a\">Cadastra-se <b>uma vez<\u002Fb>. No pedido, só o comentário é novo.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 11 — a ficha e quem lê cada parte<\u002Ffigcaption>\n<div class=\"au-bp\">\n<div>\n<div class=\"au-sheet\">\n<div class=\"au-sheeth\"><span>Ficha do exame<\u002Fspan><span>cadastra uma vez<\u002Fspan><\u002Fdiv>\n<div class=\"au-zone\"><span class=\"au-dest nome\">Nome<\u002Fspan><div class=\"au-f\"><i>nome<\u002Fi><span>Triglicerídeos em jejum de 12h<\u002Fspan><i>sinônimos<\u002Fi><span>TG em jejum · Triglicérides em jejum<\u002Fspan><i>códigos<\u002Fi><span>TUSS 40302547 · LOINC 3048-6<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-zone\"><span class=\"au-dest\">Régua<\u002Fspan><div class=\"au-f\"><i>unidade<\u002Fi><span>mg/dL<\u002Fspan><i>desejável<\u002Fi><span>menor que 150<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-zone\"><span class=\"au-dest prep\">Preparo<\u002Fspan><div class=\"au-f\"><i>jejum<\u002Fi><span>12 h<\u002Fspan><i>horário<\u002Fi><em>vazio<\u002Fem><i>coleta<\u002Fi><em>vazio<\u002Fem><i>repouso<\u002Fi><em>vazio<\u002Fem><i>duração<\u002Fi><em>vazio<\u002Fem><i>observação<\u002Fi><em>vazio<\u002Fem><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"au-sheet\">\n<div class=\"au-sheeth\"><span>Linha do pedido<\u002Fspan><span>a cada pedido<\u002Fspan><\u002Fdiv>\n<div class=\"au-zone\"><span class=\"au-dest nada\">Cópia<\u002Fspan><div class=\"au-f\"><i>da ficha<\u002Fi><span>nome, códigos e preparo<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"au-zone\"><span class=\"au-dest com\">Comentário<\u002Fspan><div class=\"au-f\"><i>texto livre<\u002Fi><em>o que só vale desta vez<\u002Fem><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div class=\"au-rdw\"><sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th><\u002Fsc-raw-th><sc-raw-th>Busca<\u002Fsc-raw-th><sc-raw-th>Linha do pedido<\u002Fsc-raw-th><sc-raw-th>Documento<\u002Fsc-raw-th><sc-raw-th>Resultado<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Nome<\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Sinônimos<\u002Fsc-raw-td><sc-raw-td><span class=\"au-o h\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Códigos<\u002Fsc-raw-td><sc-raw-td><span class=\"au-o h\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Preparo<\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Comentário<\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Régua<\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o\"><\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"au-o y\"><\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<div class=\"au-rdl\"><span><span class=\"au-o y\"><\u002Fspan> aparece<\u002Fspan><span><span class=\"au-o h\"><\u002Fspan> acha o exame, não aparece<\u002Fspan><span><span class=\"au-o\"><\u002Fspan> não aparece<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffigure>\n<p class=\"au-rule\">O código acha o exame e vai ao documento. Na linha, ninguém lê número.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"au-q\" id=\"q12\">\n<span class=\"au-n\" aria-hidden=\"true\">12<\u002Fspan>\n<h2>E na tela?<\u002Fh2>\n<p class=\"au-a\">O pedido, com as quatro gavetas no lugar. <b>Funciona<\u002Fb>: recolha o Lipidograma, clique no balão de uma linha.<\u002Fp>\n<figure class=\"au-fig\">\n<figcaption class=\"au-plq\">Fig. 12 — o pedido, em componentes do sistema<\u002Ffigcaption>\n<div class=\"au-keys\">\n<span class=\"au-key\"><span class=\"au-dest nome\">Nome<\u002Fspan>a coluna Exame<\u002Fspan>\n<span class=\"au-key\"><span class=\"au-dest prep\">Preparo<\u002Fspan>a coluna Condição, só leitura, e o maior de cada exigência no pé do card<\u002Fspan>\n<span class=\"au-key\"><span class=\"au-dest com\">Comentário<\u002Fspan>o balão abre a linha<\u002Fspan>\n<span class=\"au-key\"><span class=\"au-dest nada\">Não se escreve<\u002Fspan>as células vazias<\u002Fspan>\n<\u002Fdiv>\n<div class=\"df-root au-ds\">{{ card }}<\u002Fdiv>\n<\u002Ffigure>\n<div class=\"au-next au-full\"><b>Busca, Em massa e cadastro seguem a mesma regra.<\u002Fb><a href=\"NaTela.dc.html\">Ver na tela →<\u002Fa><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"au-q\" aria-label=\"Limites e fontes\">\n<div class=\"au-end au-full\">\n<div class=\"au-lim\"><span class=\"au-seal\">relato<\u002Fspan><span><b>“Com diluição”<\u002Fb> veio da sua prática. Não tem código na TUSS nem no LOINC.<\u002Fspan><\u002Fdiv>\n<div class=\"au-lim\"><span class=\"au-seal\">inferência<\u002Fspan><span><b>TSH e TSH ultrassensível<\u002Fb> com a mesma faixa de referência: dedução clínica, não conferida em fonte.<\u002Fspan><\u002Fdiv>\n<div class=\"au-lim\"><span class=\"au-seal\">fonte secundária<\u002Fspan><span><b>De 8 a 14 h de jejum<\u002Fb> entre laboratórios: folhas de coleta, não uma norma.<\u002Fspan><\u002Fdiv>\n<div class=\"au-lim\"><span class=\"au-seal\">lacuna<\u002Fspan><span><b>Prolactina e PSA<\u002Fb> não têm preparo no catálogo. O PSA nem está no catálogo.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"au-fontes au-full\">Fontes · <a href=\"https://tx.fhir.org/r4/CodeSystem/$lookup?system=http://loinc.org&amp;code=1558-6\">LOINC 2.83<\u002Fa><a href=\"https://hl7.org/fhir/R4/servicerequest.html\">FHIR R4 ServiceRequest<\u002Fa><a href=\"https://www.sbac.org.br/wp-content/uploads/2017/09/ConsensoOficial_PerfilLipidico_2016_v13.pdf\">Consenso do Perfil Lipídico 2016<\u002Fa><a href=\"https://diretriz.diabetes.org.br/diagnostico-de-diabetes-mellitus/\">Diretriz da SBD<\u002Fa><a href=\"Pesquisa.dc.html\">TUSS da ANS e as demais evidências<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:9600}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const R = window.React;\n    const DF = window.DietFlow || {};\n    const h = (t, p, ...k) => (t ? R.createElement(t, p, ...k) : null);\n\n    // Fig. 7: 273 exames do catálogo; 79 têm exigência para o paciente na condição usual.\n    const dots = Array.from({ length: 273 }, (_, i) => ({ c: i < 79 ? 'on' : '' }));\n\n    // Fig. 12: estado da linha (aberta, comentário, comentário em edição).\n    const st = this.state || {};\n    const open = st.open || { lip: true, tes: true };\n    const notes = st.notes || { tes: 'Com diluição.' };\n    const editing = st.editing || null;\n    const orientText = st.orient != null ? st.orient : 'Levar o frasco da urina de 24 h no dia da coleta.';\n    const put = (patch) => this.setState(patch);\n\n    const icon = (n, s) => h(DF.Icon, { icon: 'lucide:' + n, size: s || 16, width: s || 16, 'aria-hidden': true });\n    const iconButton = (name, label, o) => {\n      const x = o || {};\n      return h('span', { style: { display: 'inline-flex' }, onClick: x.onClick },\n        h(DF.Tooltip, { content: label }, h('span', { style: { display: 'inline-flex' } },\n          h(DF.Button, { isIconOnly: true, size: 'sm', variant: 'light', color: x.color || 'default', 'aria-label': label }, icon(name, x.size || 16)))));\n    };\n    const corner = h('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true },\n      h('polyline', { points: '15 10 20 15 15 20' }), h('path', { d: 'M4 4v7a4 4 0 0 0 4 4h12' }));\n\n    // Nomes do catálogo; condição = exigência usual para o paciente, vazia quando basta comparecer.\n    const EXAMS = [\n      { id: 'gli', name: 'Glicemia de Jejum', cond: 'Jejum 8 h' },\n      { id: 'ins', name: 'Insulina Basal', cond: 'Jejum 8 h' },\n      { id: 'hba', name: 'Hemoglobina Glicada' },\n      { id: 'lip', name: 'Lipidograma', kids: ['Colesterol Total', 'HDL-Colesterol', 'LDL-Colesterol', 'Triglicerídeos'] },\n      { id: 'tsh', name: 'TSH' },\n      { id: 'cor', name: 'Cortisol Matinal', cond: 'Coleta das 7 h às 9 h' },\n      { id: 'tes', name: 'Testosterona Total', cond: 'Coleta das 7 h às 9 h' },\n      { id: 'mic', name: 'Microalbuminúria', cond: 'Primeira urina da manhã' },\n      { id: 'u24', name: 'Urina 24h - Proteínas', cond: 'Coleta de 24 h' },\n      { id: 'own', name: 'Carnitina Livre', own: true },\n    ];\n    const hasNote = (e) => !!(notes[e.id] && notes[e.id].trim());\n    const hasArea = (e) => hasNote(e) || editing === e.id;\n    const canOpen = (e) => !!e.kids || hasArea(e);\n    const isOpen = (e) => canOpen(e) && !!open[e.id];\n    const toggle = (e) => { const was = !!open[e.id]; put({ open: { ...open, [e.id]: !was }, editing: was && editing === e.id && !hasNote(e) ? null : editing }); };\n    const comment = (e) => put({ open: { ...open, [e.id]: true }, editing: e.id });\n    const setNote = (e, v) => put({ notes: { ...notes, [e.id]: v }, editing: e.id });\n\n    const autocomplete = (value) => h(DF.SmartAutocomplete, { items: [], renderItem: (x) => x, inputValue: value, ariaLabel: 'Exame', placeholder: 'Buscar exame...', isOpen: false, size: 'sm' });\n    const columns = [\n      { id: 'name', header: 'Exame', cell: (r) => (r.kind === 'kid'\n        ? h('span', { className: 'kid-name' }, corner, h('span', null, r.name))\n        : h('span', { className: 'name-cell' },\n          canOpen(r.e)\n            ? iconButton(isOpen(r.e) ? 'chevron-down' : 'chevron-right', isOpen(r.e) ? 'Recolher exame' : 'Expandir exame', { onClick: () => toggle(r.e) })\n            : h('span', { className: 'chev-space', 'aria-hidden': true }),\n          h('span', { className: 'fill' }, autocomplete(r.e.name)))) },\n      { id: 'cond', header: 'Condição', width: '30%', cell: (r) => (r.kind === 'kid' || !r.e.cond ? null : h('span', { className: 'cond' }, r.e.cond)) },\n      { id: 'actions', header: 'Ações', width: '7.5rem', align: 'right', stickyEnd: true, cell: (r) => (r.kind === 'kid' ? null : h('span', { className: 'track' },\n        iconButton('message-square', 'Comentário', { size: 18, color: hasNote(r.e) ? 'primary' : 'default', onClick: () => comment(r.e) }),\n        r.e.own ? iconButton('save', 'Cadastrar exame', { size: 18, color: 'warning' }) : null,\n        iconButton('trash-2', 'Remover exame', { size: 18, color: 'danger' }))) },\n    ];\n    const rows = [];\n    EXAMS.forEach((e) => {\n      rows.push({ id: e.id, kind: 'exam', e });\n      if (!isOpen(e)) return;\n      (e.kids || []).forEach((k, i) => rows.push({ id: e.id + ':' + i, kind: 'kid', name: k, isReorderable: false }));\n      if (hasArea(e)) rows.push({ id: e.id + ':area', isGroupHeader: true, groupName: h('div', { className: 'oa', onClick: (ev) => ev.stopPropagation() },\n        h(DF.Section, { label: 'Comentário' }, h(DF.Input, { multiline: true, rows: 2, ariaLabel: 'Comentário', placeholder: 'Digite seu comentário...', value: notes[e.id] || '', onValueChange: (v) => setNote(e, v) }))) });\n    });\n\n    const field = (label, value) => h('div', { className: 'pv' }, h('span', { className: 'pv-l' }, label), h('div', { className: 'pv-v' }, value));\n    const preparo = h(DF.Section, { label: 'Preparo', showDivider: true }, h('div', { className: 'pv-stack' },\n      h(DF.Section.Grid, { columns: 3 }, field('Jejum', '8 h'), field('Duração da coleta', '24 h')),\n      field('Amostras', 'Sangue · Urina · Urina de 24 h')));\n    const orient = h(DF.Section, { label: 'Orientações ao paciente' },\n      h(DF.Input, { multiline: true, rows: 2, ariaLabel: 'Orientações ao paciente', placeholder: 'Instruções para o paciente antes do exame...', value: orientText, onValueChange: (v) => put({ orient: v }) }));\n    const card = h(DF.BaseEditableCard, {\n      title: 'Exames de rotina', titlePlaceholder: 'Nome do grupo de exames', isCollapsible: true, dragHandleProps: {},\n      suffix: h(DF.Chip, { size: 'md', variant: 'flat', color: 'secondary' }, 'Exames'),\n      actions: h(DF.Button, { isIconOnly: true, variant: 'light', 'aria-label': 'Ações do card' }, icon('more-vertical', 16)),\n    },\n    h('div', { className: 'atb' },\n      h('div', { className: 'addition' },\n        h('div', { className: 'grow' }, h(DF.SmartAutocomplete, { items: [], renderItem: (x) => x, placeholder: 'Buscar exame para adicionar...', ariaLabel: 'Buscar exame para adicionar', isOpen: false, showSearchIcon: true, hideSelectorIcon: true })),\n        h('div', { className: 'fixed' }, h(DF.Button, { variant: 'flat', startContent: icon('list-plus', 16) }, 'Em massa'))),\n      h('div', { className: 'ut-scroll' }, h(DF.UniversalTable, { cardless: true, cardlessBleed: false, cardlessPadding: 'none', enableDnD: true, columns, rows,\n        emptyTitle: 'Nenhum exame adicionado', emptyIcon: 'lucide:test-tube', emptyDescription: 'Busque um exame para começar' }))),\n    preparo, orient);\n\n    return { dots, card };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
